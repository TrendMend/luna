# Single source of truth for the app version (shown in the app, used for the APK).
# Bump versionName here for each release, then tag it: git tag v<versionName>
# versionCode is the number of git commits, so it rises with every commit automatically.
# The value below is only a fallback for builds outside a git checkout.
versionName=0.3.0
versionCode=1
