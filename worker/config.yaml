# ============================ providers (swap freely) ============================
# Each block names a livekit-plugins-<plugin> package and passes the remaining keys straight to
# that plugin's STT/LLM/TTS constructor, so ANY LiveKit plugin works by editing this file
# (plus `uv sync --extra <plugin>`). API keys come from the environment, never from this file.
# `plugin` may be a dotted module (openai.responses, google.beta). If the class is not called STT/LLM/TTS,
# name it with `class:` (google.beta + class: GeminiTTS, model: gemini-3.8-flash-tts, voice_name: Kore).
stt:
  plugin: deepgram
  model: nova-3
  language: en
llm:
  plugin: openai
  model: gpt-4.1-mini
  # Realtime model instead of the three stages (Gemini Live: one model hears and speaks; stt and tts below are then unused,
  # turn-taking is the model's own). Needs the `google` extra and GOOGLE_API_KEY:
  #   plugin: google.realtime
  #   class: RealtimeModel
  #   model: gemini-3.8-live
  #   voice: Aoede
  # OpenAI-compatible gateway example (OpenRouter, Ollama, ...):
  # base_url: https://openrouter.ai/api/v1
  # api_key_env: OPENROUTER_API_KEY     # name of the env var holding the key
tts:
  plugin: cartesia
  model: sonic-3
  voice: db6b0ed5-d5d3-463d-ae85-518a07d3c2b4   # Cartesia voice id (from their voice library; works with any model)

# Turn-taking, tuned for slow, pausing speech. Uses LiveKit's audio turn detector in its LOCAL
# variant (v1-mini, free, runs on the CPU), and local VAD for interruptions, so nothing about
# turn-taking calls a cloud service (the defaults would in dev mode).
turns:
  endpointing_mode: dynamic    # dynamic: learns this person's pause pattern within min/max; or fixed
  min_endpointing_delay: 0.8   # seconds of silence before the model may end the turn
  max_endpointing_delay: 5.0   # hard cap
  unlikely_threshold: null     # raise (e.g. 0.6) to make the detector more patient; null = calibrated default
  allow_interruptions: true
  min_interruption_words: 1    # a cough or a TV in the background is not an interruption
  min_interruption_duration: 0.5

# Server behaviour (single user, small machine).
server:
  max_sessions: 2              # conversations at once; beyond this new ones are refused
  idle_processes: 1            # warm job processes (the default is one per CPU core)
  drain_timeout: 600           # seconds a running conversation may finish after a stop/rollout signal

# Sound played while the assistant is thinking, so silence isn't mistaken for "it didn't hear me".
# file: builtin:KEYBOARD_TYPING2 (default) | KEYBOARD_TYPING | HOLD_MUSIC | a path to a wav/ogg.
# Set `thinking_sound: null` to disable.
thinking_sound:
  file: builtin:KEYBOARD_TYPING2
  volume: 0.4
  fade_in: 0.2
  fade_out: 0.3

# ============================ Home Assistant ============================
# URL and long-lived token come from the environment (HA_URL, HA_TOKEN), never from this file.
home_assistant:
  url_env: HA_URL
  token_env: HA_TOKEN

# The ONLY things the assistant may touch; anything else is refused in code, whatever the model
# says. Mirrors the "Grandpa" dashboard in Home Assistant.

# Lights. Actions: on, off, brightness (1-100), set_temperature (16-30), volume (0-100), mute, unmute.
devices:
  bedroom light:
    entity: switch.light_switch        # Bedroom Switch (HA has an auto-off timer on it)
    aliases: [bedroom lights, main light, ceiling light]
    actions: [on, off]
  corner light:
    entity: light.kajplats_e26_ws_globe_1100lm_2
    aliases: [corner lamp, lamp, corner]
    actions: [on, off, brightness]

# Bedroom fan: the dashboard buttons (they press IR buttons through Harmony).
fan:
  "off": button.bedroom_fan_off
  speed: button.bedroom_fan_speed          # "On / Speed": turns on, then steps through speeds
  mode: button.bedroom_fan_mode            # Sleep / Whisper
  timer: button.bedroom_fan_timer
  oscillate: button.bedroom_fan_oscillation

# Read-only readings (temperatures in the house, bedroom air quality).
sensors:
  bedroom temperature: sensor.bedroom_temperature
  kitchen temperature: sensor.kitchen_temperature
  living room temperature: sensor.living_room_temperature
  bonus room temperature: sensor.bonus_room_temperature
  furnace room temperature: sensor.furnace_room_temperature
  rumpus room temperature: sensor.rumpus_room_temperature
  outdoor temperature: sensor.outdoors_temperature
  bedroom PM2.5: sensor.bedroom_air_quality_sensor_pm2_5
  bedroom CO2: sensor.bedroom_air_quality_sensor_carbon_dioxide

# Doors: read-only (the assistant can look, never lock or unlock). kind: contact -> open/closed,
# kind: lock -> unlocked/locked. An unavailable sensor is reported as "can't tell", never "closed".
doors:
  front door:
    entity: binary_sensor.front_door_contact
    kind: contact
  back door:
    entity: binary_sensor.back_door_contact
    kind: contact
  double door:
    entity: binary_sensor.double_door_contact
    kind: contact
  front door lock:
    entity: binary_sensor.front_door     # a template sensor (device class "lock": on = unlocked)
    kind: lock
    invert: false                        # HA device class "lock" means on = unlocked (matches); flip only if the real door disagrees

# Web lookups (the web_search tool). Pick one; with none, Luna has no web search.
#   brave:   a Brave Search API key (free tier exists), put it in .env as BRAVE_API_KEY
#   tavily:  a Tavily key, in .env as TAVILY_API_KEY
#   searxng: your own SearXNG (needs base_url and `json` enabled in its settings); no key
#   native:  the model provider's own search tool. Needs the llm above to be `plugin: openai.responses`.
web_search:
  provider: brave
  api_key_env: BRAVE_API_KEY
  # base_url: http://10.0.0.90:8888      # searxng

# Local weather straight from Open-Meteo (no API key, not via Home Assistant). Location is
# Calgary, matching the Environment Canada integration in HA; adjust latitude/longitude as needed.
weather:
  provider: open-meteo
  name: Calgary
  latitude: 51.0447
  longitude: -114.0719
  units: metric

# ============================ TV via the Harmony hub ("Grandpa's Hub") ============================
harmony:
  remote: remote.grandpa_s_hub
  # After an activity starts, the hub ignores commands for a while. The assistant waits until HA
  # reports the activity running, then this many extra seconds, before sending channel digits.
  settle_seconds: 12
  activity_timeout: 45          # give up (and say so) if the activity never starts
  activities:                   # spoken name -> Harmony activity
    cable: Watch Cable
    youtube: Watch YouTube
    movies: Watch a Movie
    apple tv: Watch Apple TV
    dashboard: Open Dashboard
    # "off" is always available (turns the TV system off)
  commands:                     # spoken name -> [Harmony device, command]
    volume up: [Hisense TV, VolumeUp]
    volume down: [Hisense TV, VolumeDown]
    mute: [Hisense TV, Mute]
    channel up: [Arris DVR, ChannelUp]
    channel down: [Arris DVR, ChannelDown]
    previous channel: [Arris DVR, ChannelPrev]
    guide: [Arris DVR, Guide]
    pause: [Arris DVR, Pause]
    play: [Arris DVR, Play]
  cable:
    activity: cable             # key into `activities` above
    device: Arris DVR
    digit_delay: 0.4            # seconds between digits
    enter: null                 # e.g. Select, if the box needs it after the digits
    # Favourite cable channels, name -> number. The person can add more by voice
    # ("remember that channel 205 is the hockey channel"); those are saved on the NUC.
    favorites:
      # From the cable box's Favorites list. Several names can point at one number; the person can
      # use any of them. Spacing doesn't matter ("sports net east" = "sportsnet east").
      ctv: "3"
      ctv calgary: "3"
      fox: "142"
      flavour: "25"
      flavour network: "25"
      frame: "165"
      the art channel: "165"
      stingray jukebox oldies: "419"
      jukebox oldies: "419"
      oldies: "419"
      stingray country classics: "425"
      country classics: "425"
      history: "45"
      history channel: "45"
      history television: "45"
      # Sportsnet: simple regional names. Fill in the numbers from the Favorites list (the first
      # screenshot did not show them); asking for just "sportsnet" makes Luna ask which one.
      # sportsnet east: "000"
      # sportsnet west: "000"
      # sportsnet pacific: "000"
      # sportsnet one: "000"
      # (the other ~32 favourites: add them the same way, or say "remember that channel 205 is the news")

# Jellyfin Live TV on the NUC (the HA script starts "Watch a Movie", waits for the Jellyfin
# client, then tunes the channel). `channels` pins the four favourites from the Grandpa dashboard
# (101/102 named from their picture files; 304 is "Station 304", 305 is "Super Cool Station"). Nothing here talks to Jellyfin: to add a channel, add a line below
# (spoken name: channel number).
live_tv:
  script: script.jellyfin_live_tv
  channels:
    grandpa's classics station: "101"
    classics station: "101"
    only spies station: "102"
    spies station: "102"
    station 304: "304"
    channel 304: "304"
    super cool station: "305"
    channel 305: "305"

# Other one-tap things from the dashboard: spoken name -> script entity.
scripts:
  photo gallery: script.open_gallery_on_tv

# ============================ caregivers ============================
# Urgent messages are sent as high-priority alarms; normal ones are rate-limited.
caregivers:
  notify:
    - notify.mobile_app_pixel_10_pro
    - notify.mobile_app_ron_s_phone
  urgent_script: null                  # optional script to also run on urgent alerts
  min_interval_seconds: 120

# Time zone for "remind me at 3pm" and for telling the model what time it is (IANA name). Unset = this machine's zone.
# Needs the tzdata package where the OS has none (the container image and NixOS do).
timezone: America/Edmonton

person: ""                              # the person's first name, used in notification titles

# How a conversation ends. Luna always says goodbye first: after `idle_seconds` with nobody talking, after
# `max_seconds` in total, or when the person says goodbye (then the model says its own and `goodbye` is the fallback).
# Hanging up on silence also stops speech-to-text minutes from running up when nobody is there.
session:
  idle_seconds: 30
  max_seconds: 600
  goodbye: "Goodbye for now. I'm here if you need me."
  # What the model may be shown, so phones can offer the matching buttons: camera, screen (or both). Leave empty unless the
  # `llm` takes images (gpt-4.1-mini does). Nothing is offered when empty.
  vision: []

# Wake words. The listener tells the agent which one was heard (over LiveKit); the keys match the ids in
# the listener's config. `say` is spoken word for word; `reply` is an instruction for the model's first
# reply; `instructions` is added to the system prompt for that conversation. Anything not listed
# (a button press, an unknown id) gets the default greeting.
wake_words:
  rulon: &rulon_busy
    say: "Rulon is busy right now. Is there something I can help you with?"
    instructions: >
      The person called for Rulon, a caregiver who is busy right now. Help them yourself. If they need
      Rulon specifically, offer to send him a message with notify_caregivers.
  ron: *rulon_busy

agent:
  name: luna
  instructions: |
    You are Luna, a warm, patient voice assistant for an elderly person at home.
    Speak in short, simple sentences. Never rush. If you are unsure, say so.
    Changing a cable channel can take 15 to 20 seconds, so say a short "one moment" before you start it.
