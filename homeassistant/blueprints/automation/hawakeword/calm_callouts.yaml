blueprint:
  name: HA Wake Word - calm call-outs (spoken reply on a phone)
  description: >-
    Replies by speech, at full volume, on a chosen phone when one of the chosen wake words is
    heard by that same phone.

    Built for soothing someone who calls out names during the day. Overnight (a window you
    choose) it says the person is asleep and how long until morning. In an optional "away"
    window on chosen weekdays it says the person is out and when they will be back.

    Messages are editable. In them, {{ person }} is the name called (from the wake word),
    {{ time }} is the time left ("2 hours and 5 minutes") and {{ wake_time }} is the end of
    the night window.

    Requires the HA Wake Word Android app (events named hawakeword_detected) and the Home
    Assistant Companion app on the phone that should speak (Android only: it uses the alarm
    audio stream so the reply is loud even if the phone is silenced).
  domain: automation
  input:
    phone:
      name: Phone
      description: >-
        The phone that listens and speaks. It must run the HA Wake Word app (signed in to this
        Home Assistant) and the Companion app. Events are matched to it by its device id.
      selector:
        device:
          integration: mobile_app
    callout_words:
      name: Words that trigger a reply
      description: >-
        Wake word names as the app reports them (the model file name without .onnx and any
        _v0.1 suffix), lower case.
      default:
        - ron
        - rulon
      selector:
        text:
          multiple: true
    night_start:
      name: Night starts
      default: "00:00:00"
      selector:
        time: {}
    night_end:
      name: Night ends (wake-up time)
      default: "06:00:00"
      selector:
        time: {}
    night_message:
      name: Night message
      description: Spoken for any trigger word during the night window.
      default: >-
        {{ person }} is asleep right now. It is still bedtime, and it is {{ time }} away from
        {{ wake_time }}, so it's best to go back to sleep. I will wake him up when it is time.
        Not to worry.
      selector:
        text:
          multiline: true
    away_enabled:
      name: Use the "away" rule
      default: true
      selector:
        boolean: {}
    away_words:
      name: Words covered by the away rule
      description: Only these words get the away message (others are ignored in the away window).
      default:
        - rulon
      selector:
        text:
          multiple: true
    away_weekdays:
      name: Away on these days
      default:
        - sun
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    away_start:
      name: Away from
      default: "10:00:00"
      selector:
        time: {}
    away_end:
      name: Away until
      default: "18:00:00"
      selector:
        time: {}
    away_home_time:
      name: Back home at
      description: Used to work out how long until they are home. Often the same as "Away until".
      default: "18:00:00"
      selector:
        time: {}
    away_message:
      name: Away message
      default: >-
        {{ person }} is at work and won't be home for about {{ time }}. Please try not to call
        him unless it's an emergency.
      selector:
        text:
          multiline: true
    media_stream:
      name: Volume stream
      description: alarm_stream_max plays at full volume even if the phone is silenced.
      default: alarm_stream_max
      selector:
        select:
          options:
            - label: Alarm stream, full volume
              value: alarm_stream_max
            - label: Alarm stream, current alarm volume
              value: alarm_stream
            - label: Music stream, current volume
              value: music_stream
    cooldown_seconds:
      name: Ignore repeat calls for (seconds)
      description: After replying, further calls are ignored for this long so it isn't spoken over itself.
      default: 30
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: s

mode: single
max_exceeded: silent

triggers:
  - trigger: event
    event_type: hawakeword_detected

variables:
  phone: !input phone
  callout_words: !input callout_words
  away_words: !input away_words
  away_enabled: !input away_enabled
  night_start: !input night_start
  night_end: !input night_end
  away_home_time: !input away_home_time
  # notify.mobile_app_<slug of the phone's device name>; also what the app puts in the event.
  phone_slug: "{{ device_attr(phone, 'name') | slugify }}"
  # The name that was called, from the word itself ("ron" -> "Ron", "aunt_may" -> "Aunt May").
  person: "{{ trigger.event.data.wake_word | replace('_', ' ') | title }}"
  wake_time: "{{ today_at(night_end).strftime('%-I:%M %p') }}"

conditions:
  # Only the chosen words...
  - condition: template
    value_template: "{{ trigger.event.data.wake_word in callout_words }}"
  # ...and only when heard by the chosen phone, so another phone running the app can't set it off.
  # Events carry the phone's Home Assistant device id, which is exactly what the device picker
  # returns, so it is matched directly. Older app builds only send the device name, so fall back
  # to comparing that when there is no id.
  - condition: template
    value_template: >-
      {% set sent_id = trigger.event.data.device_id | default('', true) %}
      {{ sent_id == phone if sent_id else trigger.event.data.device | slugify == phone_slug }}

actions:
  - choose:
      # --- Night: it's still bedtime ---
      - conditions:
          - condition: time
            after: !input night_start
            before: !input night_end
        sequence:
          - variables:
              mins_left: >-
                {% set end = today_at(night_end) %}
                {% if end < now() %}{% set end = end + timedelta(days=1) %}{% endif %}
                {{ [(((end - now()).total_seconds() / 60) | round(0)) | int, 1] | max }}
              time: >-
                {% set h = mins_left // 60 %}{% set m = mins_left % 60 %}
                {{ [ (h ~ ' hour' ~ ('s' if h != 1 else '')) if h > 0 else none,
                     (m ~ ' minute' ~ ('s' if m != 1 else '')) if (m > 0 or h == 0) else none
                   ] | select('string') | join(' and ') }}
          - action: "notify.mobile_app_{{ phone_slug }}"
            data:
              message: TTS
              data:
                ttl: 0
                priority: high
                channel: alarm_stream
                tts_text: !input night_message
                media_stream: !input media_stream

      # --- Away window on chosen weekdays, for the chosen words ---
      - conditions:
          - condition: template
            value_template: "{{ away_enabled }}"
          - condition: time
            weekday: !input away_weekdays
            after: !input away_start
            before: !input away_end
          - condition: template
            value_template: "{{ trigger.event.data.wake_word in away_words }}"
        sequence:
          - variables:
              mins_left: >-
                {% set home = today_at(away_home_time) %}
                {{ [(((home - now()).total_seconds() / 60) | round(0)) | int, 1] | max }}
              time: >-
                {% set h = mins_left // 60 %}{% set m = mins_left % 60 %}
                {{ [ (h ~ ' hour' ~ ('s' if h != 1 else '')) if h > 0 else none,
                     (m ~ ' minute' ~ ('s' if m != 1 else '')) if (m > 0 or h == 0) else none
                   ] | select('string') | join(' and ') }}
          - action: "notify.mobile_app_{{ phone_slug }}"
            data:
              message: TTS
              data:
                ttl: 0
                priority: high
                channel: alarm_stream
                tts_text: !input away_message
                media_stream: !input media_stream

  # Ignore repeat calls for a while so a reply isn't spoken over itself.
  - delay:
      seconds: !input cooldown_seconds
