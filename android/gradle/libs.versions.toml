[versions]
screenshot = "0.0.1-alpha16"
accompanistPermissions = "0.37.3"
agp = "9.2.1"
constraintlayoutCompose = "1.1.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2026.09.00"
gson = "2.13.2"
materialIconsExtended = "1.7.8"
okhttp = "5.2.1"
timberkt = "1.5.1"
navigationCompose = "2.10.2"
onnxruntime = "1.31.1"

[libraries]
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
androidx-constraintlayout-compose = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "constraintlayoutCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
livekit-lib = { group = "io.livekit", name = "livekit-android", version = "2.30.0" }
livekit-components = { group = "io.livekit", name = "livekit-android-compose-components", version = "2.4.2" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
a2ui-model = { group = "androidx.a2ui", name = "a2ui-model", version = "1.0.0-alpha02" }
a2ui-engine = { group = "androidx.a2ui", name = "a2ui-engine", version = "1.0.0-alpha02" }
a2ui-compose-runtime = { group = "androidx.a2ui.compose", name = "compose-runtime", version = "1.0.0-alpha02" }
a2ui-compose-ui = { group = "androidx.a2ui.compose", name = "compose-ui", version = "1.0.0-alpha02" }
a2ui-material3 = { group = "androidx.compose.material3", name = "material3-a2ui", version = "1.0.0-alpha02" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version = "3.6.3" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version = "3.6.3" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }   # unit tests on a plain JVM
org-json = { group = "org.json", name = "json", version = "20260814" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot" }
timberkt = { module = "com.github.ajalt:timberkt", version.ref = "timberkt" }

[plugins]
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
