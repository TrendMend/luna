name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Mondays 05:17 UTC: new advisories and secret rules appear even when nothing in the repository changed.
    # Only the scan jobs run on a schedule.
    - cron: "17 5 * * 1"

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit (the tag is in the comment); Dependabot updates both.
jobs:
  python:
    name: Python tests and lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Lint (ruff)
        run: uvx ruff check .
      - name: Worker tests
        working-directory: worker
        run: uv run --extra openai --extra deepgram --extra cartesia --extra google --group dev pytest -q
      - name: Listener tests
        working-directory: listener
        run: uv run --group dev pytest -q

  web:
    name: Web tests and syntax check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --check web/a2ui.js
      - run: node --test "web/test/*.test.js"

  android:
    name: Android unit tests and lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Fetch openWakeWord models (not stored in the repository)
        run: python3 scripts/fetch_wakeword_models.py
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Unit tests, Android lint, debug build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

  docker:
    name: Docker build and smoke test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint < worker/Dockerfile
      - name: Make a throwaway .env with fresh secrets (no provider keys)
        run: |
          cp .env.example .env
          sed -i "s/^LIVEKIT_API_SECRET=.*/LIVEKIT_API_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^LUNA_ACCESS_KEYS=.*/LUNA_ACCESS_KEYS=ci:$(openssl rand -hex 16)/" .env
      - name: Validate the Compose file
        run: docker compose config -q
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Check that it came up
        run: |
          for _ in $(seq 1 45); do curl -fs http://localhost:8080/healthz && break; sleep 2; done
          curl -fs http://localhost:8080/healthz
          curl -fs -o /dev/null http://localhost:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/token)" = 401
          key="$(sed -n 's/^LUNA_ACCESS_KEYS=ci://p' .env)"
          curl -fs -X POST -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{}' http://localhost:8080/api/token | grep -q participant_token
          for _ in $(seq 1 45); do docker compose logs agent | grep -q 'registered worker' && break; sleep 2; done
          docker compose logs agent | grep -q 'registered worker'
      - name: Show the logs if it failed
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  sbom-and-vulnerabilities:
    name: SBOM and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Vulnerability scan (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
