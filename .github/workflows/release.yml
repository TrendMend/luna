name: Release

# Builds the Android app for a release that release-please already made (the tag and the GitHub release with the CHANGELOG.md notes exist),
# and attaches the APK and its checksum to it. release-please.yml calls this when its release pull request is merged; run it by hand
# from the Actions tab to build the APK for an existing tag again.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v0.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: write            # to create the release

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  android:
    name: Build the APK and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: The tag must match the VERSION file
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match VERSION ($version)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Fetch openWakeWord models (bundled into the app, not stored in git)
        run: python3 scripts/fetch_wakeword_models.py

      - name: Signing key
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luna-release.jks"
            {
              echo "LUNA_KEYSTORE_FILE=$RUNNER_TEMP/luna-release.jks"
              echo "LUNA_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "LUNA_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "LUNA_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: the APK will be signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests, then the release build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Name the APK and write its checksum
        run: |
          suffix=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || suffix="-debug-key"
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/luna-${VERSION}${suffix}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Attach the APK to the release
        run: |
          # release-please wrote the notes from the commits; keep them and add what only this build knows.
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo "---"
            echo
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "**Android app:** \`luna-${VERSION}.apk\` (release build, signed with the project's release key)."
            else
              echo "**Android app:** \`luna-${VERSION}-debug-key.apk\`. This build is signed with a debug key, not a release key: it installs, but an update must come from the same build source, and it is not meant for distributing to others."
            fi
            echo
            echo "The app bundles openWakeWord's pre-trained wake-word models, which are licensed CC BY-NC-SA 4.0 (non-commercial); see THIRD_PARTY.md. Checksums are in \`SHA256SUMS.txt\`."
          } >> notes.md
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --title "Luna ${VERSION}" --notes-file notes.md
