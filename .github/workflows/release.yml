name: Release

# Push a tag like v0.3.0 (after `python scripts/bump_version.py` and a commit, see docs/releasing.md) and this builds the Android app and
# publishes a GitHub release with the APK, its checksum, and the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write            # to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build the APK and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The tag must match the VERSION file
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match VERSION ($version)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Fetch openWakeWord models (bundled into the app, not stored in git)
        run: python3 scripts/fetch_wakeword_models.py

      - name: Signing key
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luna-release.jks"
            {
              echo "LUNA_KEYSTORE_FILE=$RUNNER_TEMP/luna-release.jks"
              echo "LUNA_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "LUNA_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "LUNA_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: the APK will be signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests, then the release build
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Name the APK and write its checksum
        run: |
          suffix=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || suffix="-debug-key"
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/luna-${VERSION}${suffix}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF' > notes.md
          import os, re
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else "See CHANGELOG.md.")
          EOF
          {
            echo
            echo "---"
            echo
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "**Android app:** \`luna-${VERSION}.apk\` (release build, signed with the project's release key)."
            else
              echo "**Android app:** \`luna-${VERSION}-debug-key.apk\`. This build is signed with a debug key, not a release key: it installs, but an update must come from the same build source, and it is not meant for distributing to others."
            fi
            echo
            echo "The app bundles openWakeWord's pre-trained wake-word models, which are licensed CC BY-NC-SA 4.0 (non-commercial); see THIRD_PARTY.md. Checksums are in \`SHA256SUMS.txt\`."
          } >> notes.md

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
            --title "Luna ${VERSION}" --notes-file notes.md --verify-tag
