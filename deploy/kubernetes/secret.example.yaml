# EXAMPLE ONLY. Do not commit real values. Create the real one with:
#   kubectl -n luna create secret generic luna-secrets --from-env-file=.env   # from the repo root
# or manage it with sealed-secrets / external-secrets / SOPS. It is NOT part of kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: luna-secrets
  namespace: luna
type: Opaque
stringData:
  LIVEKIT_URL: ws://livekit-server.livekit.svc.cluster.local:7880   # in-cluster URL of your LiveKit server
  LIVEKIT_PUBLIC_URL: wss://lk.example.com                          # what phones/browsers connect to
  LIVEKIT_API_KEY: luna
  LIVEKIT_API_SECRET: change-me
  LUNA_ACCESS_KEYS: "tablet:change-me-0123456789abcdef"
  LUNA_DRY_RUN: "1"                                                 # set to 0 when ready for it to act
  HA_URL: http://home-assistant.home.svc.cluster.local:8123
  HA_TOKEN: change-me
  DEEPGRAM_API_KEY: change-me
  OPENAI_API_KEY: change-me
  CARTESIA_API_KEY: change-me
