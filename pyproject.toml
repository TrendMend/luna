[project]
name = "luna-agent"
version = "0.1.0"
description = "Voice assistant agent (LiveKit Agents) for the NUC"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents~=1.8",
  "livekit-plugins-silero",
  "pyyaml",
  "python-dotenv",
]

# Provider plugins are optional extras so you install only what config.yaml uses:
#   uv sync --extra openai --extra deepgram
[project.optional-dependencies]
openai     = ["livekit-plugins-openai"]      # also covers any OpenAI-compatible base_url (OpenRouter, Ollama, ...)
deepgram   = ["livekit-plugins-deepgram"]
google     = ["livekit-plugins-google"]
anthropic  = ["livekit-plugins-anthropic"]
elevenlabs = ["livekit-plugins-elevenlabs"]
cartesia   = ["livekit-plugins-cartesia"]
assemblyai = ["livekit-plugins-assemblyai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luna"]

[dependency-groups]
dev = ["pytest"]
