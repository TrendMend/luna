<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafd">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121318">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="/manifest.webmanifest">
<title>Luna</title>
<link rel="stylesheet" href="/a2ui.css">
</head>
<body>
  <header class="md-top-bar">
    <img src="/icon-192.png" alt="" width="64" height="64">
    <h1>Luna</h1>
  </header>
  <main style="display:contents">
    <button id="talk" class="md-button md-button--filled md-talk" data-on="false" aria-live="polite">Talk to Luna</button>
    <div id="status" class="md-status" role="status"></div>
    <div id="widgets" aria-live="polite"></div>
    <div id="log" class="md-conversation" aria-live="polite"></div>
  </main>
  <p id="hint" class="md-supporting"></p>
  <button class="md-button md-button--text" id="forget">Change access key</button>
  <audio id="out" autoplay></audio>

  <dialog id="keydialog" aria-labelledby="keytitle">
    <form method="dialog">
      <h3 id="keytitle">Access key</h3>
      <p class="md-supporting" style="text-align:left;display:block">Enter the access key for this device. It stays in this browser.</p>
      <label class="md-field"><span>Access key</span><input id="keyinput" type="password" autocomplete="off" spellcheck="false" required></label>
      <div class="md-dialog-actions">
        <button class="md-button md-button--text" value="cancel" formnovalidate>Cancel</button>
        <button class="md-button md-button--filled" value="save">Save</button>
      </div>
    </form>
  </dialog>

<script src="/vendor/livekit-client.umd.min.js" onerror="loadFromCdn()"></script>
<script src="/a2ui.js"></script>
<script>
  // Run web/vendor.sh to serve livekit-client from this server (offline use). Until then use the CDN.
  function loadFromCdn() {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js';
    document.head.appendChild(s);
  }
  const $ = id => document.getElementById(id);
  const talk = $('talk'), statusEl = $('status'), logEl = $('log');
  let room = null;
  const sendUi = msg => room && room.localParticipant.sendText(JSON.stringify(msg), { topic: 'luna.ui.action' }).catch(() => {});
  const store = new A2UI.Store(null, error => sendUi({ version: A2UI.VERSION, error }));
  new A2UI.Renderer($('widgets'), store, { onAction: sendUi });

  const setStatus = t => statusEl.textContent = t;
  const addLine = (who, text) => {
    const p = document.createElement('p'); p.className = who === 'You' ? 'you' : 'luna';
    const who_ = document.createElement('span'); who_.className = 'sr-only'; who_.textContent = who === 'You' ? 'You said: ' : 'Luna said: ';
    p.append(who_, text);
    logEl.appendChild(p); logEl.scrollTop = logEl.scrollHeight;
  };
  // Setup link from `luna-web add-device` (…/#key=…): save the key, then remove it from the address bar.
  const linked = new URLSearchParams(location.hash.slice(1)).get('key');
  if (linked) { localStorage.setItem('luna-key', linked.trim()); history.replaceState(null, '', location.pathname + location.search); }
  // Ask for the access key in an M3 dialog (window.prompt blocks the page and cannot be styled or read by every screen reader).
  const askKey = () => new Promise(resolve => {
    const dlg = $('keydialog'), input = $('keyinput'); input.value = '';
    dlg.addEventListener('close', () => resolve(dlg.returnValue === 'save' ? input.value.trim() : null), { once: true });
    dlg.showModal(); input.focus();
  });
  const key = async () => {
    let k = localStorage.getItem('luna-key');
    if (!k) { k = await askKey(); if (k) localStorage.setItem('luna-key', k); }
    return k && k.trim();
  };
  $('forget').onclick = () => { localStorage.removeItem('luna-key'); setStatus('Key cleared. Press the button to enter a new one.'); };
  if (!window.isSecureContext) $('hint').textContent = 'The microphone needs https:// (or localhost). Open this page over HTTPS.';

  async function start() {
    const k = await key(); if (!k) return;
    talk.disabled = true; setStatus('Connecting…');
    try {
      const r = await fetch('/api/token', { method: 'POST', headers: { Authorization: `Bearer ${k}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ participant_attributes: { 'luna.ui': A2UI.BASIC } }) });
      if (r.status === 401) { localStorage.removeItem('luna-key'); throw new Error('That access key was not accepted.'); }
      if (r.status === 429) throw new Error('Too many attempts. Wait a minute.');
      if (!r.ok) throw new Error(`Could not get a token (${r.status}).`);
      const { server_url, participant_token } = await r.json();

      room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
      room.on(LivekitClient.RoomEvent.TrackSubscribed, track => { if (track.kind === 'audio') track.attach($('out')); });
      room.on(LivekitClient.RoomEvent.ParticipantAttributesChanged, (attrs, p) => {
        const s = attrs['lk.agent.state']; if (!s) return;
        setStatus({ listening: 'Listening…', thinking: 'Thinking…', speaking: 'Luna is speaking…', initializing: 'Waking up…' }[s] || s);
      });
      room.on(LivekitClient.RoomEvent.Disconnected, () => stop(false));
      // Live transcripts of both sides (LiveKit's standard text-stream topic).
      room.registerTextStreamHandler('lk.transcription', async (reader, info) => {
        const text = await reader.readAll();
        if (text.trim()) addLine(info.identity === room.localParticipant.identity ? 'You' : 'Luna', text);
      });
      // Widgets (docs/protocol.md): A2UI messages arrive on luna.ui; taps and errors go back on luna.ui.action.
      room.registerTextStreamHandler('luna.ui', async (reader, info) => {
        const text = await reader.readAll();
        if (info.identity !== room.localParticipant.identity) store.processText(text);
      });
      await room.connect(server_url, participant_token);
      await room.localParticipant.setMicrophoneEnabled(true);
      talk.dataset.on = 'true'; talk.textContent = 'Stop'; setStatus('Connected. Say hello.');
    } catch (e) {
      setStatus(e.message || String(e)); await stop(false);
    } finally { talk.disabled = false; }
  }

  async function stop(disconnect = true) {
    if (room && disconnect) await room.disconnect();
    store.clear(); room = null; talk.dataset.on = 'false'; talk.textContent = 'Talk to Luna';
    if (disconnect) setStatus('');
  }

  talk.onclick = () => (room ? stop() : start());
</script>
</body>
</html>
