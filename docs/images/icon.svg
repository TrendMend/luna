<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512" role="img" aria-label="Luna app icon">
  <!-- The Android launcher icon (android/app/src/main/res/drawable/ic_launcher_background.xml and ic_launcher_foreground.xml) as one
       SVG, clipped to a rounded square. Same gradients, same paths. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="14" y1="8" x2="96" y2="104">
      <stop offset="0" stop-color="#6A78F0"/>
      <stop offset="0.55" stop-color="#4A56D0"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="moon" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="72" y2="80">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE7B8"/>
    </linearGradient>
    <clipPath id="shape"><rect width="108" height="108" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <path d="M0,0h108v108h-108z" fill="url(#bg)"/>
    <path d="M49.16,29.01 A25,25 0 1 0 73.19,63.34 A21,21 0 1 1 49.16,29.01 Z" fill="url(#moon)"/>
    <path d="M72,28 L73.6,32.4 L78,34 L73.6,35.6 L72,40 L70.4,35.6 L66,34 L70.4,32.4 Z" fill="#FFF4DC"/>
  </g>
</svg>
