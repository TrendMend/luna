# Luna listener: runs on the device people talk to (a mini PC, a tablet, a Raspberry Pi).
# It listens for wake words LOCALLY (no audio leaves the device until one is heard), then joins a LiveKit
# conversation room. It also waits in a standing "control room" for calls from Home Assistant.
# The protocol is in ../docs/protocol.md.

# models_dir: /var/lib/luna-listener/models   # where built-in models are kept (or set $LUNA_MODELS_DIR); default: inside the package

device: kitchen                        # must match the name in the worker's LUNA_ACCESS_KEYS entry for this device

server:
  token_url: http://localhost:8080/api/token       # the worker's token service
  access_key_env: LUNA_ACCESS_KEY                  # env var holding this device's key (luna-web add-device kitchen)

audio:
  input_device: null               # null = system default. `luna-listener devices` lists them.
  output_device: null
  output_gain: 1.0                 # Luna's voice volume: 1.0 = as sent, 2.0 = twice as loud (louder than the speaker can play is clipped)
  echo_cancellation: true          # so Luna does not hear (and answer) her own voice from the speaker
  echo_delay_ms: 80                # speaker-to-microphone delay; tune if she still hears herself

# Wake words: what the device listens for. Turn each on or off with `enabled`. Listening for several at once is
# fine (each costs a little CPU). The id is sent to the worker as `luna.wake_word`; add the same id under
# `wake_words:` in worker/config.yaml to choose what Luna says for it (any id without an entry gets the
# default greeting). `model` is a built-in openWakeWord name or a path to your own .onnx file.
# Raise `threshold` (0-1) if it wakes by accident, lower it if it misses you.
wake_words:
  # --- built in to openWakeWord ---
  hey_jarvis:    {model: hey_jarvis,  threshold: 0.5, enabled: true}
  alexa:         {model: alexa,       threshold: 0.5, enabled: true}
  hey_mycroft:   {model: hey_mycroft, threshold: 0.5, enabled: true}
  hey_rhasspy:   {model: hey_rhasspy, threshold: 0.5, enabled: true}
  timer:         {model: timer,       threshold: 0.5, enabled: false}   # hears "set a timer", not a name
  weather:       {model: weather,     threshold: 0.5, enabled: false}   # hears "what's the weather"
  # --- your own, trained with livekit-wakeword (files in models/, found relative to this file) ---
  ron:           {model: models/ron.onnx,   threshold: 0.5, enabled: true}
  rulon:         {model: models/rulon.onnx, threshold: 0.5, enabled: true}

detection:
  patience: 2                      # consecutive 80 ms chunks over the threshold before it counts
  cooldown_seconds: 3              # ignore wake words this long after a conversation ends

session:
  max_seconds: 900                 # hard stop for one conversation
  agent_join_timeout: 20           # give up if the agent has not joined by then

# Ways a conversation can start. The wake word is always on; others are optional extras.
triggers:
  livekit_call:                    # Home Assistant makes this device "call" (data message to its control room)
    enabled: true
