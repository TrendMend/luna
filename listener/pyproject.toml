[project]
name = "luna-listener"
version = "0.1.0"
description = "Luna device endpoint: local wake words, calls from Home Assistant, LiveKit audio"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit~=1.1",          # real-time SDK: rooms, audio tracks, echo cancellation
  "aiohttp",               # token request
  "sounddevice",           # microphone and speaker
  "numpy",
  "pyyaml",
  "python-dotenv",
]

# Wake-word detection is an extra so the rest runs (and is tested) without it.
[project.optional-dependencies]
wakeword = ["openwakeword==0.6.0", "onnxruntime"]

# openWakeWord lists tflite-runtime for Linux, but only has Python 3.11 wheels and we use the ONNX models, so never install it.
[tool.uv]
override-dependencies = ["tflite-runtime; sys_platform == 'never'"]

[project.scripts]
luna-listener = "luna_listener.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luna_listener"]

[dependency-groups]
dev = ["pytest"]
